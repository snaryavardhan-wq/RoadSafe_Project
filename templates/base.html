<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RoadSafe{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('index') }}">RoadSafe</a>
    <nav>
      <a href="{{ url_for('index') }}">Analyze</a>
      <a href="{{ url_for('board') }}">Warning board</a>
      <a href="{{ url_for('analytics') }}">Analytics</a>
      <a href="{{ url_for('alerts') }}">Alert history</a>
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<p class="notice">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
